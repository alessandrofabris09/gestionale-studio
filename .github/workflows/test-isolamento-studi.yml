name: Test completi Django

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.html'
      - 'requirements.txt'
      - '.github/workflows/test-isolamento-studi.yml'
  workflow_dispatch:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DEBUG: 'False'
      SECRET_KEY: 'temporary-key-for-ci-only-not-production'
      USE_BACKBLAZE_B2: 'False'
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check --settings=gestionale.settings_ci
      - run: python manage.py test --settings=gestionale.settings_ci --verbosity 2
