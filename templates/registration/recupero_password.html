<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="same-origin">
    <title>{{ title }} · Studio Tecnico Cloud</title>
</head>
<body>
    <main>
        <h1>{% if conferma %}Imposta una nuova password{% else %}Recupero password{% endif %}</h1>
        {% if messaggio %}
            <p>{{ messaggio }}</p>
        {% elif conferma and not validlink %}
            <p>Il link è scaduto o è già stato usato.</p>
            <p><a href="{% url 'password_reset' %}">Richiedi un nuovo link</a></p>
        {% else %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">{% if conferma %}Salva password{% else %}Invia link{% endif %}</button>
            </form>
        {% endif %}
        <p><a href="{% url 'login' %}">Torna al login</a></p>
    </main>
</body>
</html>
